name: benchmark

# Maintainer-only L1-L3 re-runs. A round needs local targets, CodeQL CLI, an LLM
# endpoint and a scan database, so this job runs on a self-hosted runner. A
# GitHub-hosted runner cannot pass the preflight in tools/ci_benchmark.py; the
# job will queue rather than silently produce a green but meaningless result.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Validation tier"
        required: true
        type: choice
        options: [L1, L2, L3]
      profile:
        description: "Run profile from config/run_profiles.yaml"
        required: true
        default: jsc
        type: string
      name:
        description: "Report label (letters, digits, dot, dash, underscore)"
        required: true
        type: string
      truth:
        description: "Optional truth table override"
        required: false
        default: ""
        type: string
      task_id:
        description: "Optional scan task id for reconciliation"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: benchmark-${{ inputs.tier }}
    runs-on: [self-hosted, savr-benchmark]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen --group dev
      # bash is required on Windows self-hosted runners too (Git Bash ships with Git).
      - name: Run validation round
        shell: bash
        env:
          BENCH_TIER: ${{ inputs.tier }}
          BENCH_PROFILE: ${{ inputs.profile }}
          BENCH_NAME: ${{ inputs.name }}
          BENCH_TRUTH: ${{ inputs.truth }}
          BENCH_TASK_ID: ${{ inputs.task_id || '0' }}
          SAST_AI_SHIRO_KEY: ${{ secrets.SAST_AI_SHIRO_KEY }}
          YSO_JAVA_HOME: ${{ vars.YSO_JAVA_HOME }}
        run: >-
          uv run --frozen python tools/ci_benchmark.py
          --tier "$BENCH_TIER"
          --profile "$BENCH_PROFILE"
          --name "$BENCH_NAME"
          --truth "$BENCH_TRUTH"
          --task-id "$BENCH_TASK_ID"
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.tier }}-${{ github.run_id }}
          path: output/benchmark/
          if-no-files-found: warn
