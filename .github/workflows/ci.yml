name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI never writes back to the repository and never needs a secret, so fork PRs
# run the exact same gate as internal ones.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: OSS hygiene, lint and syntax check
        run: uv run --frozen python tools/ci_gate.py --step static

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Unit and regression tests
        run: uv run --frozen python tools/ci_gate.py --step test
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/junit.xml
          if-no-files-found: warn

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Build frontend
        run: uv run --frozen python tools/ci_gate.py --step build

  # Supplementary signal, deliberately NOT a required status check. The three
  # job names above are pinned in branch protection, so this matrix can grow or
  # shrink without touching the merge gate.
  compat:
    name: compat (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.scope }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            scope: full
          - os: windows-latest
            python-version: "3.12"
            scope: smoke
          - os: windows-latest
            python-version: "3.13"
            scope: smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen --group dev
      # Windows is a smoke signal. Several legacy tests assume a developer machine
      # (console encoding, local subprocess tools); running the whole suite on a
      # clean runner fails for environment reasons unrelated to the code.
      - name: Unit and regression tests
        if: matrix.scope == 'full'
        run: uv run --frozen python tools/ci_gate.py --step test
      - name: Static gate
        if: matrix.scope == 'smoke'
        run: uv run --frozen python tools/ci_gate.py --step static
      - name: Platform-neutral regression subset
        if: matrix.scope == 'smoke'
        run: >-
          uv run --frozen python -m pytest
          tests/test_vuln_hash.py tests/test_d2_spec_association.py -q
      - name: Upload JUnit results
        if: always() && matrix.scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: junit-compat-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_id }}
          path: output/ci/junit.xml
          if-no-files-found: warn
