name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/historical/**'
  pull_request:
    paths-ignore:
      - 'docs/historical/**'
  workflow_dispatch:

# CI never writes back to the repository and never needs a secret, so fork PRs
# run the exact same gate as internal ones.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: OSS hygiene and byte-compile
        run: uv run --frozen python tools/ci_gate.py --step static

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Unit and regression tests
        run: uv run --frozen python tools/ci_gate.py --step test
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/junit.xml
          if-no-files-found: warn

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Build frontend
        run: uv run --frozen python tools/ci_gate.py --step build
