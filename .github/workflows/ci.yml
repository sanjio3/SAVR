name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI never writes back to the repository and never needs a secret, so fork PRs
# run the exact same gate as internal ones.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: OSS hygiene, lint and syntax check
        run: uv run --frozen python tools/ci_gate.py --step static

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Build frontend
        run: uv run --frozen python tools/ci_gate.py --step build

  # Supplementary signal, deliberately NOT a required status check. The two
  # job names above are pinned in branch protection, so this matrix can grow or
  # shrink without touching the merge gate.
  compat:
    name: compat (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Static gate
        run: uv run --frozen python tools/ci_gate.py --step static
      - name: Core import smoke
        run: uv run --frozen python tools/ci_gate.py --step test
