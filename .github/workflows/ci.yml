name: ci

on:
  push:
    branches: [main]
  pull_request:

# 只需要读权限：CI 不写回仓库，也不发布产物
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 开源卫生门禁：硬编码凭据 / 开发机绝对路径 / 内部过程文档入库 /
      # 内部追踪号 / 编码损坏 / 分发面依赖闭包缺口。纯标准库实现，
      # 不依赖第三方 action 或外网密钥。
      - name: OSS hygiene gate
        run: python tools/check_oss_hygiene.py

      - name: Install dependencies
        # 项目以源码根为 import 根（pytest pythonpath=["."]），直接装依赖清单即可；
        # `pip install -e .` 在没有 [build-system] 的场景下不可靠，不作为 CI 前置条件。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Byte-compile (fast syntax gate)
        run: |
          python -m compileall -q src tools scripts tests
          python -m compileall -q frontend 2>/dev/null || true

      - name: Unit and regression tests
        env:
          # 测试不依赖真实 LLM / CodeQL / 靶场：缺失时各阶段按降级路径处理
          SAST_AI_CLOSED_LOOP: "0"
          SAST_AI_BENCHMARK_PRIOR: "1"
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        working-directory: frontend
        # 锁文件入库，用 npm ci 保证装到与仓库一致的依赖版本
        run: |
          npm ci --no-audit --no-fund
          npm run build
