version: 2
updates:
  # uv.lock is the authority for Python versions; keep it in the same PR as
  # pyproject.toml so `uv sync --frozen` never sees a stale lock file.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # vue-tsc resolves typescript/lib/tsc, which TypeScript 6 no longer exports.
      # Remove these two entries once vue-tsc supports TS 6.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-tsc"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
