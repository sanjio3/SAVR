# SAVR 全局配置样例。
#
# 用法：cp config/config.example.yaml config.yaml，按需修改。
# config.yaml 已被 .gitignore 排除，不入库；本文件是唯一的对外入口。
#
# 最小可用只需第一段：默认走本机 Ollama，不需要任何 API key。
#   1) ollama pull qwen3:8b
#   2) cp config/config.example.yaml config.yaml
#   3) 启动服务；A2 会调用 http://127.0.0.1:11434
#
# 所有取值都支持环境变量占位：把整个值写成 "${NAME}"，运行时按环境变量展开，
# 因此密钥可以只放环境变量、不必落盘。

# ---- 用哪个模型 ----
# provider 取下列段名之一：ollama / qwen / doubao / minimax / deepseek /
# openai-compatible / claude / anthropic-compatible。切换时改这里的 provider，
# 对应段的 model 与端点随即生效。
api:
  provider: "ollama"
  model: "qwen3:8b"
  max_tokens: 4096
  temperature: 0.1
  fallback_provider: ""      # 可选：首个 provider 不可用时改用它

llm:
  provider: "ollama"
  model: "qwen3:8b"

# ---- 本地模型（默认，零密钥）----
ollama:
  base_url: "http://127.0.0.1:11434"
  model: "qwen3:8b"
  num_ctx: 8192              # 上下文窗口；A2 的提示词预算按它裁剪
  think: false
  max_tokens: 4096
  temperature: 0.1
  keep_alive: "2m"

# ---- 云端：OpenAI 兼容端点 ----
# qwen / doubao / minimax / deepseek / openai-compatible 都是这一形态：
# 填 base_url、api_key、model 三项即可。
qwen:
  api_key: "${QWEN_API_KEY}"
  base_url: "https://dashscope.aliyuncs.com/api/v1"
  model: "qwen-plus"
  max_tokens: 4096
  temperature: 0.1

deepseek:
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  max_tokens: 4096
  temperature: 0.1

# ---- 云端：Anthropic 兼容端点 ----
anthropic_compatible:
  source: "config"           # config=用本段凭据；auto=读本机已有凭据
  auth_mode: "x-api-key"
  settings_dir: ""
  api_key: "${ANTHROPIC_API_KEY}"
  base_url: "https://your-endpoint.example.com/api/anthropic"
  model: "your-model"

claude:
  api_key: "${ANTHROPIC_API_KEY}"
  model: "claude-sonnet-4-6"
  max_tokens: 4096
  temperature: 0.1

# ---- 扫描 ----
scan:
  max_file_size: 500         # KB
  concurrency: 3
  languages:
    - java
    - python
  skip_dirs:
    - test
    - tests
    - target
    - .git
    - node_modules
    - vendor
    - venv
    - output
    - __pycache__

output:
  output_dir: "output"
  formats:
    - json
    - markdown

service:
  host: "127.0.0.1"
  port: 8000
  max_concurrent_tasks: 2

workspace:
  tools_dir: "src/pipeline/a3/resources/tools"
  skills_dir: "src/agents/resources/skills"

# ---- 阶段开关与并发 ----
agents:
  a1:
    enabled: true
  a2:
    enabled: true
    max_workers: 4
    llm_concurrency: 4
  i2:
    max_rounds: 1            # 重放差分反馈闭环；默认只跑一轮
  d2:
    enabled: true
    parallel_workers: 10
    use_docker: true
    ai_judge_enabled: true
